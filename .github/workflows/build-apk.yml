
name: Build HMMAZ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare Android project
        shell: bash
        run: |
          unzip -q HMMAZ_Pitch_Bend_Android_Project.zip -d android-project
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Build Android project
        shell: bash
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HMMAZ-debug-apk
          path: android-project/**/app/build/outputs/apk/debug/app-debug.apk
