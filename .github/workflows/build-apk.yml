name: Build HMMAZ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          rm -rf latest new-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O tools.zip
          mkdir -p new-tools
          unzip -q tools.zip -d new-tools
          mv new-tools/cmdline-tools latest
          yes | latest/bin/sdkmanager --licenses
          latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Android project
        run: |
          unzip -q HMMAZ_Pitch_Bend_Android_Project.zip -d android-project
          cd android-project/HMMAZ_Pitch_Bend
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HMMAZ-debug-apk
          path: android-project/HMMAZ_Pitch_Bend/app/build/outputs/apk/debug/app-debug.apk
